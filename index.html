<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ganita Manjari Tutor OS — Class 9 CBSE Maths</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --green: #16a34a;
      --green-soft: #f0fdf4;
      --yellow: #d97706;
      --yellow-soft: #fffbeb;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 48px;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      max-width: 1220px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1d4ed8, #4f46e5);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
    }
    .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .brand p { font-size: 12px; color: var(--muted); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .save-badge {
      font-size: 12px;
      color: var(--green);
      background: var(--green-soft);
      border: 1px solid #bbf7d0;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { background: var(--surface-2); border-color: #cbd5e1; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-danger { color: var(--red); border-color: #fecaca; background: var(--red-soft); }
    .btn-danger:hover { background: #fee2e2; }

    nav.tabs {
      max-width: 1220px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    nav.tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2.5px solid transparent;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    main {
      max-width: 1220px;
      margin: 22px auto 0;
      padding: 0 20px;
    }

    .view { display: none; }
    .view.active { display: block; }

    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .grid-5 { grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .card-title { font-size: 15.5px; font-weight: 700; }
    .card-sub { font-size: 12.5px; color: var(--muted); }

    .kpi-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .kpi-value { font-size: 26px; font-weight: 800; margin: 6px 0 4px; letter-spacing: -0.02em; }
    .kpi-note { font-size: 12px; color: var(--muted); }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-blue { background: var(--primary-soft); color: var(--primary); }
    .badge-green { background: var(--green-soft); color: var(--green); }
    .badge-yellow { background: var(--yellow-soft); color: var(--yellow); }
    .badge-red { background: var(--red-soft); color: var(--red); }
    .badge-purple { background: var(--purple-soft); color: var(--purple); }
    .badge-gray { background: #f1f5f9; color: #475569; }

    .pill-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .pill {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    input[type="text"], input[type="number"], input[type="date"], select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13.5px;
      font-family: inherit;
      background: var(--surface);
      color: var(--text);
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #bfdbfe;
      border-color: var(--primary);
    }
    label.field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      transition: background 0.15s;
      cursor: pointer;
    }
    .check-row:hover { background: var(--surface-2); }
    .check-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .check-row.done span {
      text-decoration: line-through;
      color: var(--muted);
    }

    .chapter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .chapter-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .watch-box {
      background: #f8fafc;
      border-left: 3px solid var(--primary);
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 12.5px;
      color: #334155;
      margin: 10px 0 12px;
    }

    .drawer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: var(--surface-2);
    }
    .table-wrap { overflow-x: auto; }

    .timer-display {
      font-size: 42px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      margin: 8px 0;
    }

    .phase-chip {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 12.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .phase-chip.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 6px;
      transition: all 0.15s;
    }
    .option-btn:hover { background: var(--surface-2); }
    .option-btn.correct { background: var(--green-soft); border-color: var(--green); color: #14532d; font-weight: 600; }
    .option-btn.wrong { background: var(--red-soft); border-color: var(--red); color: #7f1d1d; }

    .fee-btn {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .fee-paid { background: var(--green-soft); color: var(--green); border-color: #86efac; }
    .fee-unpaid { background: var(--red-soft); color: var(--red); border-color: #fecaca; }

    .empty-state {
      text-align: center;
      padding: 28px 16px;
      color: var(--muted);
      font-size: 13.5px;
    }

    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mb-12 { margin-bottom: 12px; }
    .flex-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .space-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">GM</div>
        <div>
          <h1>Ganita Manjari Tutor OS</h1>
          <p>Class 9 CBSE Maths • 14 Chapters • 2 Days/Week Schedule</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="save-badge" id="saveStatus">Auto-Saved</span>
        <button class="btn btn-sm" onclick="exportData()">Export JSON</button>
        <label class="btn btn-sm" style="cursor:pointer;">
          Import JSON
          <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)" />
        </label>
        <button class="btn btn-sm btn-danger" onclick="resetAllData()">Reset</button>
      </div>
    </div>
    <nav class="tabs" id="tabNav">
      <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="prep">My Prep (14 Ch)</button>
      <button class="tab-btn" data-tab="calendar">Year Calendar</button>
      <button class="tab-btn" data-tab="diagnostic">Basics & Diagnostic</button>
      <button class="tab-btn" data-tab="students">Students & Scores</button>
      <button class="tab-btn" data-tab="classroom">Class Room</button>
      <button class="tab-btn" data-tab="logistics">Logistics & Fees</button>
    </nav>
  </header>

  <main>
    <!-- TAB 1: DASHBOARD -->
    <section id="view-dashboard" class="view active"></section>

    <!-- TAB 2: MY PREP -->
    <section id="view-prep" class="view"></section>

    <!-- TAB 3: YEAR CALENDAR -->
    <section id="view-calendar" class="view"></section>

    <!-- TAB 4: BASICS & DIAGNOSTIC -->
    <section id="view-diagnostic" class="view"></section>

    <!-- TAB 5: STUDENTS & SCORES -->
    <section id="view-students" class="view"></section>

    <!-- TAB 6: CLASS ROOM -->
    <section id="view-classroom" class="view"></section>

    <!-- TAB 7: LOGISTICS & FEES -->
    <section id="view-logistics" class="view"></section>
  </main>

  <script>
    const STORAGE_KEY = "ganita_manjari_tutor_os_v2_2days";

    const CHAPTER_META = [
      { id: 1, part: "Part I", title: "Orienting Yourself: The Use of Coordinates", prepMonth: "Dec", teachMonth: "Apr", exemplar: false, pillars: ["geometry", "algebra"], watch: "Cartesian plane, distance & midpoint formulas. Quick early confidence builder." },
      { id: 2, part: "Part I", title: "Introduction to Linear Polynomials", prepMonth: "Dec", teachMonth: "Apr", exemplar: false, pillars: ["algebra"], watch: "Degree, linear growth/decay, slope & y-intercept. Connect directly to Ch 1 graphs." },
      { id: 3, part: "Part I", title: "The World of Numbers", prepMonth: "Dec", teachMonth: "May", exemplar: false, pillars: ["numbers"], watch: "Irrationality proofs of √2 and √3 require clean CBSE contradiction steps." },
      { id: 4, part: "Part I", title: "Exploring Algebraic Identities", prepMonth: "Dec", teachMonth: "May", exemplar: true, pillars: ["algebra"], watch: "Geometric models of identities, quadratic factorisation & rational expressions. Drill heavily." },
      { id: 5, part: "Part I", title: "I'm Up and Down, and Round and Round (Circles)", prepMonth: "Jan", teachMonth: "Nov", exemplar: true, pillars: ["geometry"], watch: "Chords, subtended angles, cyclic quadrilaterals. Enforce Given → To Prove → Proof format." },
      { id: 6, part: "Part I", title: "Measuring Space: Perimeter and Area", prepMonth: "Jan", teachMonth: "Aug", exemplar: false, pillars: ["mensuration"], watch: "Heron's formula, Brahmagupta's formula, circles & sectors. Watch out for unit conversions." },
      { id: 7, part: "Part I", title: "The Mathematics of Maybe: Probability", prepMonth: "Jan", teachMonth: "Nov", exemplar: false, pillars: ["data"], watch: "Empirical vs theoretical probability, tree diagrams. High-scoring breather chapter." },
      { id: 8, part: "Part I", title: "Predicting What Comes Next: Sequences", prepMonth: "Jan", teachMonth: "Oct", exemplar: true, pillars: ["numbers", "algebra"], watch: "AP & GP (newly added to Class 9). Pre-solve every word problem before class." },
      { id: 9, part: "Part II", title: "Propositions and their Converses", prepMonth: "Feb", teachMonth: "Jun", exemplar: false, pillars: ["geometry"], watch: "Logical statements, converses, proofs & counterexamples. Sets up all geometry proofs." },
      { id: 10, part: "Part II", title: "How Quantities Combine: Understanding Data", prepMonth: "Feb", teachMonth: "Aug", exemplar: false, pillars: ["data"], watch: "Weighted mean, mixtures & stacked bar charts. Check calculation accuracy." },
      { id: 11, part: "Part II", title: "The World of Algorithms", prepMonth: "Feb", teachMonth: "Jul", exemplar: false, pillars: ["numbers", "data"], watch: "Divisors, prime testing & Euclid's subtraction algorithm for GCD/HCF." },
      { id: 12, part: "Part II", title: "Quadrilaterals", prepMonth: "Feb", teachMonth: "Jul", exemplar: true, pillars: ["geometry"], watch: "Parallelogram properties, Midpoint Theorem, medians & centroids. Do not rush proofs." },
      { id: 13, part: "Part II", title: "Two Variables, One Line", prepMonth: "Mar", teachMonth: "Oct", exemplar: true, pillars: ["algebra", "geometry"], watch: "Pairs of linear equations (substitution, elimination, consistency ratios a1/a2, b1/b2, c1/c2)." },
      { id: 14, part: "Part II", title: "Math of Space: Surface Area and Volume", prepMonth: "Mar", teachMonth: "Dec", exemplar: false, pillars: ["mensuration"], watch: "Cones, spheres, hemispheres, pyramids. Pure formula recall + arithmetic discipline." }
    ];

    const PREP_STEPS = [
      "Read chapter text & in-text puzzles",
      "Solved all exercises by hand in Master Notebook",
      "Color-coded Yellow & Red tricky questions",
      "Practiced CBSE proof / step-marking format",
      "Reviewed Exemplar / extra twist questions"
    ];

    const LAUNCH_CHECKLIST = [
      "Download Ganita Manjari Part I & Part II PDFs (or buy physical copies)",
      "Buy dedicated thick register for your Master Notebook",
      "Confirm 2 days/week schedule, monthly fee & location with parents",
      "Complete Chapters 1–14 self-prep by mid-March",
      "Blind re-solve all Red-Tag questions in late March",
      "Send late-February / early-March start-date confirmation message"
    ];

    const PILLARS = [
      {
        id: "numbers",
        name: "Number Fluency & Exponents",
        chapters: "Ch 3, Ch 8, Ch 11",
        skills: "Integer sign rules, unlike fractions, squares/roots up to 20, laws of exponents.",
        questions: [
          { id: "n1", prompt: "Evaluate: -7 - (-4) + (-2)", options: ["-5", "-13", "-1", "5"], correct: 0, exp: "Subtracting a negative adds it: -7 + 4 - 2 = -5." },
          { id: "n2", prompt: "Simplify: (2³ × 2⁻⁵) ÷ 2⁻⁴", options: ["2² (4)", "2⁻⁶", "2⁶ (64)", "2⁻²"], correct: 0, exp: "Numerator: 3 + (-5) = -2. Divide: -2 - (-4) = 2 → 2² = 4." }
        ]
      },
      {
        id: "algebra",
        name: "Core Algebra",
        chapters: "Ch 2, Ch 4, Ch 13",
        skills: "Opening negative brackets, 1-variable equations, basic identities (a±b)² and a²-b².",
        questions: [
          { id: "a1", prompt: "Expand and simplify: 5x - 2(3x - 4)", options: ["-x + 8", "-x - 8", "11x - 8", "-x - 4"], correct: 0, exp: "Distribute -2 across both terms: 5x - 6x + 8 = -x + 8." },
          { id: "a2", prompt: "Factorise: 49x² - 16", options: ["(7x - 4)(7x + 4)", "(7x - 4)²", "(49x - 16)(x + 1)", "(7x + 4)²"], correct: 0, exp: "Difference of squares: a² - b² = (a - b)(a + b)." }
        ]
      },
      {
        id: "geometry",
        name: "Essential Geometry",
        chapters: "Ch 1, Ch 5, Ch 9, Ch 12",
        skills: "Parallel lines & transversals, triangle angle sum, Pythagoras Theorem, congruence.",
        questions: [
          { id: "g1", prompt: "A right triangle has legs 6 cm and 8 cm. What is its hypotenuse?", options: ["10 cm", "14 cm", "12 cm", "100 cm"], correct: 0, exp: "√(6² + 8²) = √(36 + 64) = √100 = 10 cm." },
          { id: "g2", prompt: "Two parallel lines are cut by a transversal. One co-interior angle is 65°. The other is:", options: ["115°", "65°", "25°", "90°"], correct: 0, exp: "Co-interior angles are supplementary: 180° - 65° = 115°." }
        ]
      },
      {
        id: "mensuration",
        name: "Mensuration & Units",
        chapters: "Ch 6, Ch 14",
        skills: "2D area formulas, circle circumference/area, squared & cubed unit conversions.",
        questions: [
          { id: "m1", prompt: "How many cm² are in 1 m²?", options: ["10,000 cm²", "100 cm²", "1,000 cm²", "1,000,000 cm²"], correct: 0, exp: "1 m = 100 cm, so 1 m² = 100 × 100 = 10,000 cm²." },
          { id: "m2", prompt: "Area of a triangle with base 12 cm and height 7 cm:", options: ["42 cm²", "84 cm²", "19 cm²", "38 cm²"], correct: 0, exp: "Area = ½ × base × height = ½ × 12 × 7 = 42 cm²." }
        ]
      },
      {
        id: "data",
        name: "Data, Ratios & Divisibility",
        chapters: "Ch 7, Ch 10, Ch 11",
        skills: "Arithmetic mean, fractions/ratios/percentages, HCF/LCM, prime factorisation.",
        questions: [
          { id: "d1", prompt: "The mean of 5 numbers is 14. What is their sum?", options: ["70", "19", "2.8", "65"], correct: 0, exp: "Sum = Mean × Count = 14 × 5 = 70." },
          { id: "d2", prompt: "What is the HCF (GCD) of 36 and 48?", options: ["12", "6", "144", "24"], correct: 0, exp: "36 = 2² × 3² and 48 = 2⁴ × 3, so HCF = 2² × 3 = 12." }
        ]
      }
    ];

    const TEACH_MONTHS = ["Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "Jan", "Feb"];
    const FEE_MONTHS = ["Apr 2027", "May 2027", "Jun 2027", "Jul 2027", "Aug 2027", "Sep 2027", "Oct 2027", "Nov 2027", "Dec 2027", "Jan 2028", "Feb 2028", "Mar 2028"];

    function createDefaultState() {
      const chapters = {};
      CHAPTER_META.forEach(c => {
        chapters[c.id] = {
          steps: [false, false, false, false, false],
          confidence: "none", // none, red, yellow, green
          teachMonth: c.teachMonth,
          teachStatus: "Not Started", // Not Started, In Progress, Taught, Revised
          tags: [] // { id, qRef, level: 'red'|'yellow', hint, resolved: false }
        };
      });

      const fees = {};
      FEE_MONTHS.forEach(m => { fees[m] = { s1: false, s2: false }; });

      return {
        launch: LAUNCH_CHECKLIST.map(() => false),
        chapters,
        weeklyRhythm: [false, false, false], // Sunday Prep, Class 1, Class 2
        students: {
          s1: { name: "Student 1", school: "CBSE Class 9", notes: "" },
          s2: { name: "Student 2", school: "CBSE Class 9", notes: "" }
        },
        diagnostic: { s1: {}, s2: {} },
        tests: [], // { id, name, date, chapter, max, s1, s2 }
        attendance: [], // { id, date, slot: 'Class 1'|'Class 2', chapter, s1Att, s1Hw, s2Att, s2Hw }
        parkingLot: [], // { id, chapter, question, resolved }
        logistics: {
          daysPerWeek: "2 days/week (e.g., Tue & Fri)",
          duration: "1.5 hours per class",
          mode: "Offline / Home Tuition",
          feePerStudent: 1500,
          dueDate: "5th of every month",
          startMonth: "April 2027"
        },
        fees
      };
    }

    let state = loadState();
    let ui = {
      activeTab: "dashboard",
      prepFilter: "All",
      prepSubView: "chapters", // chapters | redqueue
      openDrawers: {},
      diagStudent: "s1",
      classroomChapter: 1,
      classMode: "class1" // class1 | class2
    };

    // Timers (in-memory)
    let ritualTimer = { seconds: 20 * 60, running: false, interval: null };
    let classPhases = {
      class1: [
        { name: "Concept + 1 Worked Example", mins: 20 },
        { name: "Guided Student Solving (Pen in Their Hands)", mins: 60 },
        { name: "Homework Assignment (6–8 Qs) & Wrap-Up", mins: 10 }
      ],
      class2: [
        { name: "Homework Check & Doubt Clearing", mins: 15 },

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createDefaultState();
        const parsed = JSON.parse(raw);
        return Object.assign(createDefaultState(), parsed);
      } catch (e) {
        return createDefaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const badge = document.getElementById("saveStatus");
      if (badge) {
        badge.textContent = "Saved " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      }
    }

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function switchTab(tab) {
      ui.activeTab = tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + tab));
      renderCurrentTab();
    }

    document.getElementById("tabNav").addEventListener("click", e => {
      if (e.target.matches(".tab-btn")) switchTab(e.target.dataset.tab);
    });

    function getStats() {
      let totalSteps = CHAPTER_META.length * PREP_STEPS.length;
      let doneSteps = 0;
      let readyChapters = 0;
      let unresolvedReds = 0;
      let taughtChapters = 0;

      CHAPTER_META.forEach(c => {
        const ch = state.chapters[c.id];
        doneSteps += ch.steps.filter(Boolean).length;
        if (ch.confidence === "green") readyChapters++;
        if (ch.teachStatus === "Taught" || ch.teachStatus === "Revised") taughtChapters++;
        unresolvedReds += ch.tags.filter(t => t.level === "red" && !t.resolved).length;
      });

      let avgScore = null;
      if (state.tests.length > 0) {
        let pctSum = 0, count = 0;
        state.tests.forEach(t => {
          if (t.max > 0) {
            if (t.s1 !== "" && t.s1 !== null) { pctSum += (Number(t.s1) / Number(t.max)) * 100; count++; }
            if (t.s2 !== "" && t.s2 !== null) { pctSum += (Number(t.s2) / Number(t.max)) * 100; count++; }
          }
        });
        if (count > 0) avgScore = Math.round(pctSum / count);
      }

      let paidSlots = 0;
      FEE_MONTHS.forEach(m => {
        if (state.fees[m]?.s1) paidSlots++;
        if (state.fees[m]?.s2) paidSlots++;
      });
      const totalCollected = paidSlots * (Number(state.logistics.feePerStudent) || 0);

      return {
        prepPct: Math.round((doneSteps / totalSteps) * 100),
        doneSteps, totalSteps, readyChapters, unresolvedReds, taughtChapters, avgScore, paidSlots, totalCollected
      };
    }

    function getStudentPillarStatus(studentKey, pillarId) {
      const pillar = PILLARS.find(p => p.id === pillarId);
      const ans = state.diagnostic[studentKey] || {};
      let answered = 0, correct = 0;
      pillar.questions.forEach(q => {
        if (ans[q.id] !== undefined) {
          answered++;
          if (ans[q.id] === q.correct) correct++;
        }
      });
      if (answered === 0) return { label: "Untested", cls: "badge-gray", gap: false };
      if (correct === pillar.questions.length) return { label: "Ready", cls: "badge-green", gap: false };
      return { label: `Gap (${correct}/${pillar.questions.length})`, cls: "badge-red", gap: true };
    }

    function toggleDrawer(chId) {
      ui.openDrawers[chId] = !ui.openDrawers[chId];
      renderPrep();
    }
    function addTag(chId) {
      const qRef = document.getElementById(`tagRef-${chId}`).value.trim();
      const level = document.getElementById(`tagLevel-${chId}`).value;
      const hint = document.getElementById(`tagHint-${chId}`).value.trim();
      if (!qRef) return alert("Enter a question reference first (e.g., Ex 5.2 Q4).");
      state.chapters[chId].tags.push({ id: "t_" + Date.now(), qRef, level, hint, resolved: false });
      saveState();
      renderPrep();
    }
    function resolveTag(chId, tagId) {
      const t = state.chapters[chId].tags.find(x => x.id === tagId);
      if (t) t.resolved = true;
      saveState();
      renderPrep();
    }
    function deleteTag(chId, tagId) {
      state.chapters[chId].tags = state.chapters[chId].tags.filter(x => x.id !== tagId);
      saveState();
      renderPrep();
    }

            <div class="card">
              <div class="card-title mb-12">${k === "s1" ? "Student 1 Profile" : "Student 2 Profile"}</div>
              <div class="grid" style="gap:10px;">
                <div>
                  <label class="field-label">Student Name (updates across all tabs)</label>
                  <input type="text" value="${escapeHtml(state.students[k].name)}" onchange="updateStudent('${k}', 'name', this.value)" />
                </div>
                <div>
                  <label class="field-label">School / Notes</label>
                  <input type="text" value="${escapeHtml(state.students[k].notes)}" placeholder="e.g., Strong in algebra, rushes geometry steps" onchange="updateStudent('${k}', 'notes', this.value)" />
                </div>
              </div>
            </div>
          `).join("")}
        </div>

        <div class="card mb-12">
          <div class="card-header">
            <div>
              <div class="card-title">Score Trend Chart (%)</div>
              <div class="card-sub"><span style="color:var(--primary); font-weight:700;">● ${escapeHtml(state.students.s1.name)}</span> &nbsp; <span style="color:var(--purple); font-weight:700;">● ${escapeHtml(state.students.s2.name)}</span></div>
            </div>
          </div>
          ${renderScoreSvg()}
        </div>

        <div class="grid grid-2">
          <div class="card">
            <div class="card-title mb-12">Log Weekly Mini-Test / Exam</div>
            <div class="grid grid-2" style="gap:8px;">
              <div><label class="field-label">Test Name</label><input type="text" id="tName" placeholder="e.g., Ch 1 Mini-Test" /></div>
              <div><label class="field-label">Date</label><input type="date" id="tDate" /></div>
              <div><label class="field-label">Max Marks</label><input type="number" id="tMax" value="15" /></div>
              <div><label class="field-label">Chapter</label>
                <select id="tCh">${CHAPTER_META.map(c => `<option value="Ch ${c.id}">Ch ${c.id}: ${escapeHtml(c.title.slice(0, 22))}</option>`).join("")}<option value="Full Mock">Full Syllabus Mock</option></select>
              </div>
              <div><label class="field-label">${escapeHtml(state.students.s1.name)} Score</label><input type="number" id="tS1" placeholder="e.g., 13" /></div>
              <div><label class="field-label">${escapeHtml(state.students.s2.name)} Score</label><input type="number" id="tS2" placeholder="e.g., 11" /></div>
            </div>
            <button class="btn btn-primary mt-12" onclick="addTest()">+ Log Test Score</button>

            <div class="table-wrap mt-16">
              <table>
                <thead><tr><th>Test</th><th>${escapeHtml(state.students.s1.name)}</th><th>${escapeHtml(state.students.s2.name)}</th><th></th></tr></thead>
                <tbody>
                  ${state.tests.length === 0 ? `<tr><td colspan="4" class="empty-state">No tests logged yet.</td></tr>` : state.tests.slice().reverse().map(t => `
                    <tr>
                      <td><strong>${escapeHtml(t.name)}</strong><div class="card-sub">${escapeHtml(t.date || "")} • ${escapeHtml(t.chapter)}</div></td>
                      <td>${t.s1}/${t.max} (${Math.round((t.s1/t.max)*100)}%)</td>
                      <td>${t.s2}/${t.max} (${Math.round((t.s2/t.max)*100)}%)</td>
                      <td><button class="btn btn-sm btn-danger" onclick="deleteTest('${t.id}')">×</button></td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <div class="card-title mb-12">Class Attendance & Homework (2 Days/Week)</div>
            <div class="grid grid-2" style="gap:8px;">
              <div><label class="field-label">Date</label><input type="date" id="aDate" /></div>
              <div><label class="field-label">Weekly Slot</label>
                <select id="aSlot">
                  <option value="Class 1 (Teach + Practice)">Class 1 (Teach + Practice)</option>
                  <option value="Class 2 (Review + Mini-Test)">Class 2 (Review + Mini-Test)</option>
                </select>
              </div>
              <div><label class="field-label">${escapeHtml(state.students.s1.name)}</label>
                <select id="aS1">
                  <option value="Present • HW Done">Present • HW Done</option>
                  <option value="Present • HW Missed">Present • HW Missed</option>
                  <option value="Absent">Absent</option>
                </select>
              </div>
              <div><label class="field-label">${escapeHtml(state.students.s2.name)}</label>
                <select id="aS2">
                  <option value="Present • HW Done">Present • HW Done</option>
                  <option value="Present • HW Missed">Present • HW Missed</option>
                  <option value="Absent">Absent</option>
                </select>
              </div>
            </div>
            <button class="btn btn-primary mt-12" onclick="addAttendance()">+ Log Class Session</button>

            <div class="table-wrap mt-16">
              <table>
                <thead><tr><th>Session</th><th>${escapeHtml(state.students.s1.name)}</th><th>${escapeHtml(state.students.s2.name)}</th><th></th></tr></thead>
                <tbody>
                  ${state.attendance.length === 0 ? `<tr><td colspan="4" class="empty-state">No sessions logged yet.</td></tr>` : state.attendance.slice().reverse().map(a => `
                    <tr>
                      <td><strong>${escapeHtml(a.date || "Session")}</strong><div class="card-sub">${escapeHtml(a.slot)}</div></td>
                      <td>${escapeHtml(a.s1)}</td>
                      <td>${escapeHtml(a.s2)}</td>
                      <td><button class="btn btn-sm btn-danger" onclick="deleteAttendance('${a.id}')">×</button></td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderScoreSvg() {
      if (state.tests.length === 0) {
        return `<div class="empty-state">Log at least one test below to visualize both students' percentage trend over the year.</div>`;
      }
      const W = 680, H = 190, padL = 36, padR = 20, padT = 16, padB = 28;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const n = state.tests.length;
      const xAt = i => n === 1 ? padL + plotW / 2 : padL + (i / (n - 1)) * plotW;
      const yAt = pct => padT + plotH - (Math.max(0, Math.min(100, pct)) / 100) * plotH;

      const pts1 = state.tests.map((t, i) => `${xAt(i)},${yAt((t.s1 / t.max) * 100)}`).join(" ");
      const pts2 = state.tests.map((t, i) => `${xAt(i)},${yAt((t.s2 / t.max) * 100)}`).join(" ");

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; max-height:220px;">
          ${[0, 25, 50, 75, 100].map(v => `
            <line x1="${padL}" y1="${yAt(v)}" x2="${W - padR}" y2="${yAt(v)}" stroke="#e2e8f0" stroke-dasharray="3,3" />
            <text x="6" y="${yAt(v) + 4}" font-size="10" fill="#64748b">${v}%</text>
          `).join("")}
          ${n > 1 ? `<polyline fill="none" stroke="#2563eb" stroke-width="2.5" points="${pts1}" />` : ""}
          ${n > 1 ? `<polyline fill="none" stroke="#7c3aed" stroke-width="2.5" points="${pts2}" />` : ""}
          ${state.tests.map((t, i) => `
            <circle cx="${xAt(i)}" cy="${yAt((t.s1 / t.max) * 100)}" r="4.5" fill="#2563eb" />
            <circle cx="${xAt(i)}" cy="${yAt((t.s2 / t.max) * 100)}" r="4.5" fill="#7c3aed" />
            <text x="${xAt(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#64748b">${escapeHtml(t.name.slice(0, 10))}</text>
          `).join("")}
        </svg>
      `;
    }

    function updateStudent(k, field, val) {
      state.students[k][field] = val.trim() || (k === "s1" ? "Student 1" : "Student 2");
      saveState();
      renderStudents();
    }
    function addTest() {
      const name = document.getElementById("tName").value.trim();
      const date = document.getElementById("tDate").value;
      const max = Number(document.getElementById("tMax").value);
      const chapter = document.getElementById("tCh").value;
      const s1 = Number(document.getElementById("tS1").value);
      const s2 = Number(document.getElementById("tS2").value);
      if (!name || !max) return alert("Enter test name and max marks.");
      state.tests.push({ id: "tst_" + Date.now(), name, date, max, chapter, s1, s2 });
      saveState();
      renderStudents();
    }
    function deleteTest(id) {
      state.tests = state.tests.filter(t => t.id !== id);
      saveState();
      renderStudents();
    }
    function addAttendance() {
      const date = document.getElementById("aDate").value;
      const slot = document.getElementById("aSlot").value;
      const s1 = document.getElementById("aS1").value;
      const s2 = document.getElementById("aS2").value;
      state.attendance.push({ id: "att_" + Date.now(), date, slot, s1, s2 });
      saveState();
      renderStudents();
    }
    function deleteAttendance(id) {
      state.attendance = state.attendance.filter(a => a.id !== id);
      saveState();
      renderStudents();
    }

    // ---------------- RENDER: CLASS ROOM ----------------
    function fmtTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function renderClassroom() {
      const el = document.getElementById("view-classroom");
      const chMeta = CHAPTER_META.find(c => c.id === Number(ui.classroomChapter));
      const chState = state.chapters[chMeta.id];
      const gaps = [];
      chMeta.pillars.forEach(pid => {
        const p = PILLARS.find(x => x.id === pid);
        const r1 = getStudentPillarStatus("s1", pid);
        const r2 = getStudentPillarStatus("s2", pid);
        if (r1.gap || r2.gap) {
          gaps.push({ pillar: p.name, s1: r1.gap, s2: r2.gap });
        }
      });

      const phases = classPhases[ui.classMode];

      el.innerHTML = `
        <div class="card mb-12">
          <div class="space-between">
            <div>
              <div class="card-title">Today's Teaching Chapter</div>
              <div class="card-sub">Surfaces prerequisite gaps & your Yellow/Red opening-step hints automatically</div>
            </div>
            <select style="width:auto; min-width:280px;" onchange="ui.classroomChapter=Number(this.value); renderClassroom()">
              ${CHAPTER_META.map(c => `<option value="${c.id}" ${c.id === chMeta.id ? 'selected' : ''}>Ch ${c.id}: ${escapeHtml(c.title)}</option>`).join("")}
            </select>
          </div>
          <div class="grid grid-2 mt-12">
            <div class="watch-box" style="margin:0;">
              <strong>Prerequisite Gap Alerts:</strong><br/>
              ${gaps.length === 0
                ? "No foundational gaps flagged for this chapter (or run the Day 1 Diagnostic first)."
                : gaps.map(g => `• <strong>${escapeHtml(g.pillar)}</strong>: ${g.s1 ? escapeHtml(state.students.s1.name) : ''} ${g.s1 && g.s2 ? '& ' : ''}${g.s2 ? escapeHtml(state.students.s2.name) : ''} — do a 10-min warmup first.`).join("<br/>")
              }
            </div>
            <div class="watch-box" style="margin:0; border-left-color:var(--yellow);">
              <strong>Your Logged Yellow/Red Opening Hints:</strong><br/>
              ${chState.tags.length === 0
                ? "No tricky questions logged for this chapter in My Prep yet."
                : chState.tags.map(t => `• <strong>${escapeHtml(t.qRef)}</strong>: ${escapeHtml(t.hint || "No hint")}`).join("<br/>")
              }
            </div>
          </div>
        </div>

        <div class="grid grid-2 mb-12">
          <div class="card">
            <div class="card-title">20-Min Pre-Class Ritual Timer</div>
            <div class="card-sub">Evening before class: rehearse Line 1 of every Yellow/Red question</div>
            <div class="timer-display" id="ritualDisplay">${fmtTime(ritualTimer.seconds)}</div>
            <div class="flex-row mb-12">
              <button class="btn btn-primary" onclick="toggleRitualTimer()">${ritualTimer.running ? "Pause" : "Start"}</button>
              <button class="btn" onclick="resetRitualTimer()">Reset 20:00</button>
            </div>
            <div class="card-sub">
              1. Flip through today's section in Master Notebook.<br/>
              2. Mentally rehearse the opening move of Yellow/Red questions.<br/>
              3. Pick 6–8 targeted homework problems before class starts.
            </div>
          </div>

          <div class="card">
            <div class="space-between mb-12">
              <div>
                <div class="card-title">90-Min Live Class Pacing Timer</div>
                <div class="card-sub">Tailored to your 2-day weekly schedule</div>
              </div>
              <div class="flex-row">
                <button class="pill ${ui.classMode === 'class1' ? 'active' : ''}" onclick="setClassMode('class1')">Class 1 (Teach)</button>
                <button class="pill ${ui.classMode === 'class2' ? 'active' : ''}" onclick="setClassMode('class2')">Class 2 (Test Day)</button>
              </div>
            </div>
            <div class="timer-display" id="liveDisplay">${fmtTime(liveTimer.seconds)}</div>
            <div class="flex-row mb-12">
              <button class="btn btn-primary" onclick="toggleLiveTimer()">${liveTimer.running ? "Pause" : "Start"}</button>
              <button class="btn" onclick="prevPhase()">← Prev</button>
              <button class="btn" onclick="nextPhase()">Next →</button>
              <button class="btn" onclick="resetLivePhase()">Reset Phase</button>
            </div>
            ${phases.map((p, i) => `
              <div class="phase-chip ${i === liveTimer.phaseIdx ? 'active' : ''}">
                <span>${i + 1}. ${escapeHtml(p.name)}</span>
                <span>${p.mins} min</span>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="card">
          <div class="card-title mb-12">Parking Lot (Mid-Class Doubt Catcher)</div>
          <div class="card-sub mb-12">Never bluff if a student asks an unexpected twist question—park it here and start next class with it.</div>
          <div class="flex-row mb-12">
            <input type="text" id="parkInput" placeholder="e.g., RD Sharma Ch 5 Q14 — chord bisector proof" style="flex:1; min-width:240px;" />
            <button class="btn btn-primary" onclick="addParking()">+ Park Doubt</button>
          </div>
          ${state.parkingLot.length === 0 ? `<div class="card-sub">Parking lot is clear.</div>` : state.parkingLot.map(p => `
            <div class="phase-chip" style="background:${p.resolved ? 'var(--green-soft)' : 'var(--surface-2)'}">
              <span style="${p.resolved ? 'text-decoration:line-through; color:var(--muted)' : ''}">
                <strong>Ch ${p.chapter}:</strong> ${escapeHtml(p.question)}
              </span>
              <div class="flex-row">
                <button class="btn btn-sm" onclick="toggleParking('${p.id}')">${p.resolved ? "Reopen" : "Cleared ✓"}</button>
                <button class="btn btn-sm btn-danger" onclick="deleteParking('${p.id}')">×</button>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function toggleRitualTimer() {
      if (ritualTimer.running) {
        clearInterval(ritualTimer.interval);
        ritualTimer.running = false;
      } else {
        ritualTimer.running = true;
        ritualTimer.interval = setInterval(() => {
          if (ritualTimer.seconds > 0) {
            ritualTimer.seconds--;
            const d = document.getElementById("ritualDisplay");
            if (d) d.textContent = fmtTime(ritualTimer.seconds);
          } else {
            clearInterval(ritualTimer.interval);
            ritualTimer.running = false;
          }
        }, 1000);
      }
      renderClassroom();
    }
    function resetRitualTimer() {
      clearInterval(ritualTimer.interval);
      ritualTimer.running = false;
      ritualTimer.seconds = 20 * 60;
      renderClassroom();
    }

    function setClassMode(mode) {
      clearInterval(liveTimer.interval);
      ui.classMode = mode;
      liveTimer.running = false;
      liveTimer.phaseIdx = 0;
      liveTimer.seconds = classPhases[mode][0].mins * 60;
      renderClassroom();
    }
    function toggleLiveTimer() {
      if (liveTimer.running) {
        clearInterval(liveTimer.interval);
        liveTimer.running = false;
      } else {
        liveTimer.running = true;
        liveTimer.interval = setInterval(() => {
          if (liveTimer.seconds > 0) {
            liveTimer.seconds--;
            const d = document.getElementById("liveDisplay");
            if (d) d.textContent = fmtTime(liveTimer.seconds);
          } else {
            clearInterval(liveTimer.interval);
            liveTimer.running = false;
          }
        }, 1000);
      }
      renderClassroom();
    }
    function prevPhase() {
      if (liveTimer.phaseIdx > 0) {
        clearInterval(liveTimer.interval);
        liveTimer.running = false;
        liveTimer.phaseIdx--;
        liveTimer.seconds = classPhases[ui.classMode][liveTimer.phaseIdx].mins * 60;
        renderClassroom();
      }
    }
    function nextPhase() {
      const list = classPhases[ui.classMode];
      if (liveTimer.phaseIdx < list.length - 1) {
        clearInterval(liveTimer.interval);
        liveTimer.running = false;
        liveTimer.phaseIdx++;
        liveTimer.seconds = list[liveTimer.phaseIdx].mins * 60;
        renderClassroom();
      }
    }
    function resetLivePhase() {
      clearInterval(liveTimer.interval);
      liveTimer.running = false;
      liveTimer.seconds = classPhases[ui.classMode][liveTimer.phaseIdx].mins * 60;
      renderClassroom();
    }

    function addParking() {
      const q = document.getElementById("parkInput").value.trim();
      if (!q) return;
      state.parkingLot.push({ id: "pk_" + Date.now(), chapter: ui.classroomChapter, question: q, resolved: false });
      saveState();
      renderClassroom();
    }
    function toggleParking(id) {
      const item = state.parkingLot.find(x => x.id === id);
      if (item) item.resolved = !item.resolved;
      saveState();
      renderClassroom();
    }
    function deleteParking(id) {
      state.parkingLot = state.parkingLot.filter(x => x.id !== id);
      saveState();
      renderClassroom();
    }

    // ---------------- RENDER: LOGISTICS & FEES ----------------
    function renderLogistics() {
      const el = document.getElementById("view-logistics");
      const feeRate = Number(state.logistics.feePerStudent) || 0;
      const stats = getStats();
      const totalExpected = FEE_MONTHS.length * 2 * feeRate;

      el.innerHTML = `
        <div class="card mb-12">
          <div class="card-title mb-12">Tuition Terms & Schedule</div>
          <div class="grid grid-3" style="gap:10px;">
            <div><label class="field-label">Days / Week</label><input type="text" value="${escapeHtml(state.logistics.daysPerWeek)}" onchange="updateLogistics('daysPerWeek', this.value)" /></div>
            <div><label class="field-label">Class Duration</label><input type="text" value="${escapeHtml(state.logistics.duration)}" onchange="updateLogistics('duration', this.value)" /></div>
            <div><label class="field-label">Mode / Location</label><input type="text" value="${escapeHtml(state.logistics.mode)}" onchange="updateLogistics('mode', this.value)" /></div>
            <div><label class="field-label">Monthly Fee per Student (₹)</label><input type="number" value="${feeRate}" onchange="updateLogistics('feePerStudent', Number(this.value))" /></div>
            <div><label class="field-label">Payment Due Date</label><input type="text" value="${escapeHtml(state.logistics.dueDate)}" onchange="updateLogistics('dueDate', this.value)" /></div>
            <div><label class="field-label">Session Start</label><input type="text" value="${escapeHtml(state.logistics.startMonth)}" onchange="updateLogistics('startMonth', this.value)" /></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-title">12-Month Fee Tracker (April 2027 – March 2028)</div>
              <div class="card-sub">Collected: <strong>₹${stats.totalCollected.toLocaleString("en-IN")}</strong> • Pending: <strong>₹${(totalExpected - stats.totalCollected).toLocaleString("en-IN")}</strong></div>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Month</th>
                  <th>${escapeHtml(state.students.s1.name)} (₹${feeRate})</th>
                  <th>${escapeHtml(state.students.s2.name)} (₹${feeRate})</th>
                  <th>Month Total</th>
                </tr>
              </thead>
              <tbody>
                ${FEE_MONTHS.map(m => {
                  const row = state.fees[m] || { s1: false, s2: false };
                  const mTotal = (row.s1 ? feeRate : 0) + (row.s2 ? feeRate : 0);
                  return `
                    <tr>
                      <td><strong>${m}</strong></td>
                      <td><button class="fee-btn ${row.s1 ? 'fee-paid' : 'fee-unpaid'}" onclick="toggleFee('${m}', 's1')">${row.s1 ? 'Paid ✓' : 'Unpaid'}</button></td>
                      <td><button class="fee-btn ${row.s2 ? 'fee-paid' : 'fee-unpaid'}" onclick="toggleFee('${m}', 's2')">${row.s2 ? 'Paid ✓' : 'Unpaid'}</button></td>
                      <td><strong>₹${mTotal.toLocaleString("en-IN")}</strong></td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function updateLogistics(field, val) {
      state.logistics[field] = val;
      saveState();
      renderLogistics();
    }
    function toggleFee(month, sKey) {
      state.fees[month][sKey] = !state.fees[month][sKey];
      saveState();
      renderLogistics();
    }

    // ---------------- BACKUP & RESET ----------------
    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ganita-manjari-tutor-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          state = Object.assign(createDefaultState(), parsed);
          saveState();
          renderCurrentTab();
          alert("Backup imported successfully!");
        } catch (err) {
          alert("Invalid JSON backup file.");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    }

    function resetAllData() {
      if (!confirm("Reset all saved progress, scores, and fee records?")) return;
      state = createDefaultState();
      saveState();
      renderCurrentTab();
    }

    function renderCurrentTab() {
      if (ui.activeTab === "dashboard") renderDashboard();
      else if (ui.activeTab === "prep") renderPrep();
      else if (ui.activeTab === "calendar") renderCalendar();
      else if (ui.activeTab === "diagnostic") renderDiagnostic();
      else if (ui.activeTab === "students") renderStudents();
      else if (ui.activeTab === "classroom") renderClassroom();
      else if (ui.activeTab === "logistics") renderLogistics();
    }

    renderCurrentTab();
  </script>
</body>
</html>
